# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

# Ported from AutoHotkey `:*:` hotstrings (SyncDrive/Scripts/Lib.ahk).
# `:*:` expands immediately with no ending character, which is espanso's default.
# AHK also requires a word boundary before the trigger, hence left_word.
matches:
  - trigger: "tyg"
    replace: "tyrsius@gmail.com"
    left_word: true

  - trigger: "tkd"
    replace: "tim@kye.dev"
    left_word: true

  - trigger: "tku"
    replace: "tim.kye@usenourish.com"
    left_word: true

  - trigger: "addrs"
    replace: "3350 SW Lundgren Ter"
    left_word: true

  - trigger: "addrf"
    replace: "3350 SW Lundgren Terrace, Beaverton OR 97005"
    left_word: true
