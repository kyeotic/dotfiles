# MangoHud — enabled for all Vulkan apps via MANGOHUD=1 (hypr/hyprland.lua).
# OpenGL-only games still need the Steam launch option: mangohud %command%
#
# Logging feeds the Omarchy bar "gamestats" widget (.config/omarchy/bar/scripts/gamestats).
# output_folder must be an absolute, existing path (no ~ expansion); the widget creates it.
autostart_log=1
log_interval=100
output_folder=/tmp/mangohud

# Presets live in presets.conf. Logging stops when the HUD is hidden (no_display /
# toggle_hud), so preset 1 is a transparent HUD instead. Shift_R+F10 cycles presets.
preset=1,2

# Non-games that render with Vulkan; keeps them out of the gamestats widget
blacklist=mpv
