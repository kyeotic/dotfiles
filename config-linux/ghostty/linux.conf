# Linux-only Ghostty settings, included by ../.config/ghostty/config.
# Lives in the config-linux stow package, which scripts/stow only links on Linux.

# Omarchy-tuned font size (macOS keeps Ghostty's default)
font-size = 9

# GTK only
gtk-toolbar-style = flat

# Fix general slowness on hyprland (https://github.com/ghostty-org/ghostty/discussions/3224)
async-backend = epoll
